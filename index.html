<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 인강 플래너</title>
  <style>
    :root {
      --bg-color: #FAFAFA;
      --card-bg: #FFFFFF;
      --primary: #FF7E36;
      --primary-light: #FFF0E6;
      --primary-dark: #E05D12;
      --text-main: #2C2C2C;
      --text-muted: #7A7A7A;
      --border-color: #EAEAEA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* 상단 입력 카드 */
    .card {
      background: var(--card-bg);
      padding: 1.75rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(255, 126, 54, 0.06);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.35rem;
      color: var(--primary);
      margin-bottom: 1.25rem;
      font-weight: 700;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .input-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    input[type="text"], input[type="date"] {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      background-color: #FAFAFA;
    }

    input:focus {
      border-color: var(--primary);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(255, 126, 54, 0.15);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 126, 54, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background-color: #CCC;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* AI 확인 및 수강 영역 */
    .main-card {
      display: none;
    }

    .verify-box {
      background-color: var(--primary-light);
      padding: 1.25rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 126, 54, 0.2);
      margin-bottom: 1.25rem;
    }

    .verify-box .info-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 0.3rem;
    }

    .verify-box .info-detail {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 0.8rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    /* 오늘 요약 */
    .today-summary {
      text-align: center;
      padding: 1.5rem 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .today-summary h2 {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }

    .today-stats {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.2rem;
    }

    .today-time {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .attendance-check {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: var(--primary-light);
      padding: 1.1rem;
      border-radius: 14px;
      margin-top: 1.25rem;
      cursor: pointer;
      border: 1px solid rgba(255, 126, 54, 0.2);
      transition: all 0.2s ease;
    }

    .attendance-check:hover {
      background: #FFE8DA;
    }

    .attendance-check input {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .attendance-check span {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    /* 스케줄 목록 */
    .schedule-header {
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .schedule-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      background-color: #F8F9FA;
      border: 1px solid var(--border-color);
      font-size: 0.92rem;
      transition: all 0.2s ease;
    }

    .schedule-item.today {
      border-color: var(--primary);
      background-color: #FFFBF8;
    }

    .schedule-item.done {
      text-decoration: line-through;
      color: var(--text-muted);
      background-color: #F1F1F1;
      border-color: #E5E5E5;
    }

    .badge-today {
      background: var(--primary);
      color: white;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
    }

    .loading {
      text-align: center;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.95rem;
      display: none;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 상단: 인강 이름 및 기간 입력창 -->
    <div class="card">
      <div class="header-title">
        <span>🍊</span>
        <span>스마트 인강 스케줄러</span>
      </div>
      <div class="input-group">
        <div>
          <div class="input-label">인강 이름</div>
          <input type="text" id="lectureName" placeholder="예: EBS 수능특강 수학I, 윤혜정의 개념의 나비효과" />
        </div>
        <div class="input-row">
          <div>
            <div class="input-label">시작 날짜</div>
            <input type="date" id="startDate" />
          </div>
          <div>
            <div class="input-label">목표 종료 날짜</div>
            <input type="date" id="endDate" />
          </div>
        </div>
        <button class="btn-primary" id="searchBtn" onclick="searchLecture()">인강 정보 찾기 & 분배하기</button>
      </div>
      <div id="loading" class="loading">AI가 인강 정보(강의수, 평균 시간)를 탐색 중입니다...</div>
    </div>

    <!-- 중앙: 검증 및 수강 현황 -->
    <div class="card main-card" id="mainCard">
      <!-- AI 검색 정보 확인 단계 -->
      <div class="verify-box" id="verifyBox">
        <div class="info-title" id="aiLectureInfo">강의명: - | 선생님: -</div>
        <div class="info-detail" id="aiDetailInfo">총 강수: -강 | 1강당 평균 시간: -분</div>
        <label class="checkbox-label">
          <input type="checkbox" id="verifyCheck" onchange="toggleConfirm(this)" />
          찾은 인강 정보가 맞습니다. (일정 계산 시작)
        </label>
      </div>

      <!-- 플랜 내용 (인강 확인 후 활성화) -->
      <div id="planSection" style="display: none;">
        <div class="today-summary">
          <h2>오늘 학습 목표</h2>
          <div class="today-stats" id="todayEpisodes">0강</div>
          <div class="today-time" id="todayTime">총 예상 시간: 0분</div>
        </div>

        <label class="attendance-check">
          <input type="checkbox" id="todayCheck" onchange="toggleTodayDone(this.checked)" />
          <span>오늘 인강 수강 완료!</span>
        </label>

        <div class="schedule-header">전체 기간 수강 일정표</div>
        <div class="schedule-list" id="scheduleList">
          <!-- 일자별 세부 일정 출력 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = todayStr;

    let currentLectureData = null;
    let schedulePlan = [];

    async function searchLecture() {
      const name = document.getElementById('lectureName').value.trim();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;

      if (!name || !startDate || !endDate) {
        alert('인강 이름과 시작/끝 날짜를 모두 입력해주세요.');
        return;
      }

      if (new Date(startDate) > new Date(endDate)) {
        alert('시작 날짜는 끝 날짜보다 이전이어야 합니다.');
        return;
      }

      const searchBtn = document.getElementById('searchBtn');
      const loading = document.getElementById('loading');
      searchBtn.disabled = true;
      loading.style.display = 'block';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lectureName: name })
        });

        const data = await response.json();

        if (!response.ok || !data.found) {
          alert('인강 정보를 찾을 수 없거나 오류가 발생했습니다. 정확한 강의명을 입력해주세요.');
          return;
        }

        currentLectureData = {
          ...data,
          startDate,
          endDate
        };

        document.getElementById('aiLectureInfo').innerText = `${data.lectureTitle} (${data.teacherName} 선생님)`;
        document.getElementById('aiDetailInfo').innerText = `총 ${data.totalEpisodes}강 · 1강당 약 ${data.avgDurationMinutes}분`;
        
        document.getElementById('verifyCheck').checked = false;
        document.getElementById('planSection').style.display = 'none';
        document.getElementById('mainCard').style.display = 'block';

      } catch (err) {
        alert('서버 통신 중 오류가 발생했습니다.');
      } finally {
        searchBtn.disabled = false;
        loading.style.display = 'none';
      }
    }

    function toggleConfirm(checkbox) {
      if (checkbox.checked) {
        calculateSchedule();
        document.getElementById('planSection').style.display = 'block';
      } else {
        document.getElementById('planSection').style.display = 'none';
      }
    }

    function calculateSchedule() {
      if (!currentLectureData) return;

      const start = new Date(currentLectureData.startDate);
      const end = new Date(currentLectureData.endDate);
      const dayDiff = Math.floor((end - start) / (1000 * 60 * 60 * 24)) + 1;

      let dates = [];
      for (let i = 0; i < dayDiff; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        const dateString = d.toISOString().split('T')[0];
        
        const existing = schedulePlan.find(p => p.date === dateString);
        dates.push({
          date: dateString,
          done: existing ? existing.done : false,
          episodes: 0
        });
      }

      const totalEp = currentLectureData.totalEpisodes;
      const remainingDays = dates.filter(d => !d.done);
      
      if (remainingDays.length > 0) {
        const baseEp = Math.floor(totalEp / remainingDays.length);
        let extraEp = totalEp % remainingDays.length;

        remainingDays.forEach(day => {
          day.episodes = baseEp + (extraEp > 0 ? 1 : 0);
          if (extraEp > 0) extraEp--;
        });
      }

      schedulePlan = dates;
      renderUI();
    }

    function toggleTodayDone(isDone) {
      const todayPlan = schedulePlan.find(p => p.date === todayStr);
      if (todayPlan) {
        todayPlan.done = isDone;
        recalculateFromToday();
      }
    }

    function recalculateFromToday() {
      const totalEp = currentLectureData.totalEpisodes;
      
      const doneDays = schedulePlan.filter(p => p.done);
      const completedEpCount = doneDays.reduce((sum, p) => sum + p.episodes, 0);
      
      const remainingDays = schedulePlan.filter(p => !p.done);
      let leftEp = totalEp - completedEpCount;
      if (leftEp < 0) leftEp = 0;

      if (remainingDays.length > 0) {
        const base = Math.floor(leftEp / remainingDays.length);
        let remainder = leftEp % remainingDays.length;

        remainingDays.forEach(day => {
          day.episodes = base + (remainder > 0 ? 1 : 0);
          if (remainder > 0) remainder--;
        });
      }

      renderUI();
    }

    function renderUI() {
      const scheduleListEl = document.getElementById('scheduleList');
      scheduleListEl.innerHTML = '';

      const todayPlan = schedulePlan.find(p => p.date === todayStr);
      const avgMinutes = currentLectureData.avgDurationMinutes;

      if (todayPlan) {
        document.getElementById('todayEpisodes').innerText = `${todayPlan.episodes}강`;
        const totalMin = todayPlan.episodes * avgMinutes;
        const hours = (totalMin / 60).toFixed(1);
        document.getElementById('todayTime').innerText = `총 예상 시간: 약 ${totalMin}분 (${hours}시간)`;
        document.getElementById('todayCheck').checked = todayPlan.done;
      } else {
        document.getElementById('todayEpisodes').innerText = `일정 없음`;
        document.getElementById('todayTime').innerText = `선택한 수강 기간 내에 오늘 날짜가 포함되어 있지 않습니다.`;
      }

      schedulePlan.forEach(plan => {
        const isToday = plan.date === todayStr;
        const item = document.createElement('div');
        item.className = `schedule-item ${isToday ? 'today' : ''} ${plan.done ? 'done' : ''}`;
        
        const totalMin = plan.episodes * avgMinutes;
        item.innerHTML = `
          <div>
            <strong>${plan.date}</strong>
            ${isToday ? '<span class="badge-today">오늘</span>' : ''}
          </div>
          <div>
            <strong>${plan.episodes}강</strong> (${totalMin}분)
          </div>
        `;
        scheduleListEl.appendChild(item);
      });
    }
  </script>
</body>
</html>
