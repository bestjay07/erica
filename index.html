<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>인강 플래너</title>
</head>
<body>

  <!-- 기존 입력 폼 및 결과 컨테이너 -->
  <input type="text" id="lectureInput" placeholder="인강 이름을 입력하세요">
  <button onclick="searchLecture()">검색</button>

  <div id="resultContainer"></div>

  <!-- ⚠️ 자바스크립트 코드는 반드시 아래처럼 <script> 태그 안에 넣어주셔야 합니다! -->
  <script>
    async function searchLecture() {
      const lectureName = document.getElementById('lectureInput').value;
      if (!lectureName) return alert('강의명을 입력해주세요.');
      
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lectureName })
      });
      
      const data = await response.json();
      
      if (data.candidates && data.candidates.length > 0) {
        renderCandidateList(data.candidates);
      } else {
        alert('검색 결과가 없습니다.');
      }
    }

    function renderCandidateList(candidates) {
      const container = document.getElementById('resultContainer');
      container.innerHTML = '<h3>원하시는 강의를 선택해주세요:</h3>';
      
      candidates.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'candidate-item';
        btn.style.display = 'block';
        btn.style.margin = '8px 0';
        btn.style.padding = '10px';
        btn.style.width = '100%';
        btn.style.textAlign = 'left';
        btn.style.cursor = 'pointer';
        
        btn.innerHTML = `
          <strong>${item.lectureTitle}</strong> (${item.teacherName} 선생님)<br>
          <small>총 ${item.totalEpisodes}강 / 강당 약 ${item.avgDurationMinutes}분</small>
        `;
        
        btn.onclick = () => {
          selectLecture(item);
        };
        
        container.appendChild(btn);
      });
    }

    function selectLecture(selected) {
      alert(`'${selected.lectureTitle}' 강의가 선택되었습니다!`);
      // 선택 후 추가 로직 처리
    }
  </script>
</body>
</html>
